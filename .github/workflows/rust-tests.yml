name: Rust tests

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-tests.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-tests.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# only cancel superseded PR runs; main runs always finish so they save the
# cache that PR runs restore from
concurrency:
  group: rust-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # no debug info: compiles the bundled duckdb C++ much faster and shrinks the cache
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # system libraries tauri links against on linux
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      # bundled duckdb is slow to compile, so cache target/ between runs.
      # save even when tests fail so a failing test doesn't force a full rebuild
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # generate_context! requires frontendDist (../dist) to exist at compile time,
      # the tests don't need the real frontend build
      - name: Create placeholder frontend dist
        run: mkdir -p ../dist

      - name: Build tests
        run: cargo test --test unit --no-run

      - name: Run tests
        run: cargo test --test unit
