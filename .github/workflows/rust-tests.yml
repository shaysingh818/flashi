name: Rust tests

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-tests.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-tests.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # system libraries tauri links against on linux
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      # bundled duckdb is slow to compile, so cache target/ between runs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # generate_context! requires frontendDist (../dist) to exist at compile time,
      # the tests don't need the real frontend build
      - name: Create placeholder frontend dist
        run: mkdir -p ../dist

      - name: Run tests
        run: cargo test --test unit
